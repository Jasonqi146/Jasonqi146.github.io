- title: Research Focus
  type: nested_list
  contents:
    - title: Post-training and agentic RL
      items:
        - Reinforcement learning for terminal and coding agents with GRPO, reward design, LLM-as-judge feedback, and environment data selection.
        - Distributed rollout infrastructure for long-horizon agents and large-scale training loops.
    - title: Evaluation and scalable oversight
      items:
        - Rubric design, rubric failure-mode diagnostics, reward-model evaluation, human-AI oversight, and preference pipelines.
        - Benchmarks and interactive environments for coding agents, computer-use agents, clinical AI, social intelligence, and long-context reasoning.
    - title: Complex systems taste
      items:
        - I study systems where behavior emerges through feedback: agents, social interaction, human judgment, and professional workflows.

